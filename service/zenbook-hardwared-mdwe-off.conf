# Not installed by default. Copy to
#   /etc/systemd/system/zenbook-hardwared.service.d/50-mdwe-off.conf
# and run `systemctl daemon-reload` only if the service logs
# "PyGObject callback self-test failed" (libffi without static trampolines
# needs writable+executable closure memory). Remove it again once fixed.
[Service]
