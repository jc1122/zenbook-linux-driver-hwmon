<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name; only root and members of zenbook-hw may
       call it. Everyone else is denied by the system bus default policy.
       Every method is additionally authorised in the service with polkit
       CheckAuthorization on the caller's unique bus name. -->
  <policy user="root">
    <allow own="org.zenbook.Hardware1"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.zenbook.Hardware1"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy group="zenbook-hw">
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.zenbook.Hardware1"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="org.zenbook.Hardware1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.zenbook.Hardware1"/>
  </policy>
</busconfig>
